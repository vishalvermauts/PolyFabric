[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infinite-memory-protocol"
version = "1.0.0"
description = "Near-instant local memory and multi-project Neural Mesh protocol for AI coding agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "StructZero Engineering Team", email = "dev@structzero.app" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "lancedb>=0.40.0",
    "fastembed>=0.9.0",
    "mcp>=1.0.0",
    "watchdog>=4.0.0",
    "tree-sitter>=0.21.0,<0.25.0",
    "tree-sitter-python>=0.23.0,<0.24.0",
    "tree-sitter-javascript>=0.23.0,<0.24.0",
    "tree-sitter-typescript>=0.23.0,<0.24.0",
    "tree-sitter-go>=0.23.0,<0.24.0",
    "tree-sitter-rust>=0.21.0,<0.22.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.3.0"
]

[project.scripts]
infinite-memory = "infinite_memory.server:main"
memory-mesh = "infinite_memory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/infinite_memory"]
